<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="100%" height="100%">
  <defs>
    <!-- Background linear & radial gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="45%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <radialGradient id="glowCyan" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowEmerald" cx="50%" cy="90%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Linear title & badge gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Filter for soft glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .glow-orb {
        animation: pulseOrb 8s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: pulseOrb2 10s ease-in-out infinite alternate;
      }
      .floating-stream {
        stroke-dasharray: 12, 12;
        animation: dashStream 24s linear infinite;
      }
      .reverse-stream {
        stroke-dasharray: 8, 14;
        animation: dashStreamRev 20s linear infinite;
      }
      .badge-glow {
        animation: badgePulse 4s ease-in-out infinite alternate;
      }
      @keyframes pulseOrb {
        0% { transform: scale(1) translate(0, 0); opacity: 0.7; }
        100% { transform: scale(1.15) translate(30px, 15px); opacity: 0.95; }
      }
      @keyframes pulseOrb2 {
        0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
        100% { transform: scale(1.2) translate(-25px, -20px); opacity: 0.9; }
      }
      @keyframes dashStream {
        to { stroke-dashoffset: -400; }
      }
      @keyframes dashStreamRev {
        to { stroke-dashoffset: 400; }
      }
      @keyframes badgePulse {
        0% { filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.2)); }
        100% { filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.45)); }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="440" fill="url(#bgGradient)" rx="16" />

  <!-- Animated Ambient Glows (placed deep in background) -->
  <g class="glow-orb">
    <circle cx="240" cy="110" r="280" fill="url(#glowCyan)" />
  </g>
  <g class="glow-orb-2">
    <circle cx="1060" cy="290" r="320" fill="url(#glowPurple)" />
  </g>
  <circle cx="640" cy="400" r="260" fill="url(#glowEmerald)" />

  <!-- Background Grid -->
  <rect width="1280" height="440" fill="url(#grid)" rx="16" />

  <!-- Dynamic Animated Tech Circuit / Signal Streams (behind text) -->
  <g opacity="0.35">
    <path d="M-50,220 C300,100 500,340 850,180 C1050,90 1200,260 1330,200" fill="none" stroke="#38bdf8" stroke-width="2" class="floating-stream" />
    <path d="M-50,280 C250,380 600,160 900,290 C1100,380 1200,180 1330,260" fill="none" stroke="#a855f7" stroke-width="1.8" class="reverse-stream" />
    <path d="M 120,60 L 260,60 L 320,120" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,6" />
    <path d="M 1160,380 L 1020,380 L 960,320" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,6" />
  </g>

  <!-- Foreground Content Container -->
  <!-- Top Pill / Category Tag -->
  <g transform="translate(640, 68)" text-anchor="middle" class="badge-glow">
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.2" />
    <circle cx="-162" cy="0" r="4" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="8" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="1.2">
      ⚡ 2026 CURATED FULL-STACK ECOSYSTEM
    </text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(640, 142)" text-anchor="middle">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
      Awesome Full-Stack Web Frameworks
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(640, 185)" text-anchor="middle">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="18" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
      Hosted Cloud PaaS, Edge Runtimes, Meta-Frameworks &amp; Self-Hosted Developer Stacks
    </text>
  </g>

  <!-- Foreground Interactive / Category Pills Bar (Clear, Foreground, Unhidden) -->
  <g transform="translate(640, 245)" text-anchor="middle">
    <!-- Pill 1: Edge & SSR Meta-Frameworks -->
    <g transform="translate(-400, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🚀 Next.js • Nuxt • SvelteKit</text>
    </g>

    <!-- Pill 2: Unified Backend & AI Agents -->
    <g transform="translate(-135, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🧠 Motia • Laravel • Django • Rails</text>
    </g>

    <!-- Pill 3: Self-Hosted Cloud & PaaS -->
    <g transform="translate(135, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">📦 Coolify • Dokku • Kamal</text>
    </g>

    <!-- Pill 4: Cloud & Edge Providers -->
    <g transform="translate(400, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🌐 Vercel • Cloudflare • Render</text>
    </g>
  </g>

  <!-- Lower Stats / Metrics Bar -->
  <g transform="translate(640, 325)">
    <!-- Glass card container -->
    <rect x="-490" y="-36" width="980" height="72" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />

    <!-- Metric 1 -->
    <g transform="translate(-360, 2)" text-anchor="middle">
      <text x="0" y="-3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#38bdf8">20+ Frameworks</text>
      <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#64748b">Verified &amp; Ranked</text>
    </g>

    <line x1="-240" y1="-20" x2="-240" y2="20" stroke="#334155" stroke-width="1" />

    <!-- Metric 2 -->
    <g transform="translate(-120, 2)" text-anchor="middle">
      <text x="0" y="-3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#a855f7">100% Free Tiers</text>
      <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#64748b">Documented &amp; Tested</text>
    </g>

    <line x1="0" y1="-20" x2="0" y2="20" stroke="#334155" stroke-width="1" />

    <!-- Metric 3 -->
    <g transform="translate(120, 2)" text-anchor="middle">
      <text x="0" y="-3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#10b981">Open Source First</text>
      <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#64748b">Live Social Star Badges</text>
    </g>

    <line x1="240" y1="-20" x2="240" y2="20" stroke="#334155" stroke-width="1" />

    <!-- Metric 4 -->
    <g transform="translate(360, 2)" text-anchor="middle">
      <text x="0" y="-3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#f59e0b">$35B+ Market</text>
      <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#64748b">Sector Dynamics</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="40" y1="425" x2="1240" y2="425" stroke="url(#titleGrad)" stroke-width="2" stroke-opacity="0.7" />
</svg>